<div class="auth-card">
  <h2>{{ mode === 'login' ? 'Connexion' : 'Créer un compte' }}</h2>

  <ng-container *ngIf="mode === 'register'">
    <input [(ngModel)]="fullName" name="fullName" placeholder="Nom complet" />
    <select [(ngModel)]="role" name="role">
      <option value="CLIENT">Client</option>
      <option value="TECHNICIAN">Technicien</option>
    </select>
  </ng-container>

  <input [(ngModel)]="email" name="email" type="email" placeholder="Email" />
  <input [(ngModel)]="password" name="password" type="password" placeholder="Mot de passe" />

  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="info" *ngIf="info">{{ info }}</p>

  <button (click)="submit()">{{ mode === 'login' ? 'Se connecter' : "S'inscrire" }}</button>
  <a (click)="toggle()">{{ mode === 'login' ? 'Pas de compte ? Inscription' : 'Déjà inscrit ? Connexion' }}</a>
</div>
